<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Form Filler</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    /* Tabs Navigation */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-base);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all var(--transition);
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    
    /* Profile Form Grid */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .profile-grid .field-group.full-width {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <!-- ══ HEADER ═══════════════════════════════════════════ -->
  <header class="header">
    <div class="header-icon">✦</div>
    <div class="header-text">
      <h1 class="header-title">AI Form Filler</h1>
      <p class="header-subtitle">Fill any form with your data instantly</p>
    </div>
    <div id="authStatusBadge" class="status-badge status-badge--checking">
      <span class="status-dot"></span>
      <span id="authStatusText">Checking…</span>
    </div>
  </header>

  <!-- ══ TABS ══════════════════════════════════════════════ -->
  <div class="tabs">
    <button id="tabHome" class="tab-btn active">Home</button>
    <button id="tabProfile" class="tab-btn">My Profile</button>
  </div>

  <!-- ══ HOME TAB ══════════════════════════════════════════ -->
  <main id="viewHome" class="main tab-content active">

    <!-- Active Resume Info -->
    <div class="field-group">
      <label class="label">Primary Resume</label>
      <div id="activeResumeInfo" class="pdf-file-info pdf-file-info--hidden" style="display:flex; justify-content:space-between;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="pdf-file-icon">📎</span>
          <span id="activeResumeName" class="pdf-file-name">document.pdf</span>
        </div>
        <span class="status-badge status-badge--ok" style="font-size:9px;">Active</span>
      </div>
      <div id="noResumeWarning" class="result-card result-card--info">
        <span class="result-card__icon">⚠️</span> No resume found. Please upload a resume below (Mandatory).
      </div>
    </div>

    <!-- Resume Upload Dropzone -->
    <div class="field-group">
      <label class="label">
        Upload Resume <span class="label-hint">PDF up to 20MB</span>
      </label>
      <div id="pdfDropZone" class="pdf-drop-zone" role="button" tabindex="0" aria-label="Upload PDF file">
        <input type="file" id="pdfFileInput" accept="application/pdf" hidden />
        <div id="pdfDropIcon" class="pdf-drop-icon">📄</div>
        <div id="pdfDropText" class="pdf-drop-text">
          <strong>Drop PDF here</strong> or <span class="pdf-drop-link">click to browse</span>
        </div>
        <div id="pdfDropSub" class="pdf-drop-sub">This will be set as your primary resume</div>
      </div>
    </div>

    <!-- Job Description (collapsible) -->
    <div class="jd-panel">
      <button id="jdToggle" class="jd-toggle" aria-expanded="false">
        <span class="jd-toggle-icon">📋</span>
        Job Description
        <span class="label-hint" style="text-transform:none;letter-spacing:0;font-weight:400;">for smarter answers</span>
        <span class="jd-toggle-arrow">▾</span>
      </button>
      <div id="jdBody" class="jd-body jd-body--collapsed">
        <textarea
          id="jdInput"
          class="textarea textarea--teal"
          placeholder="Paste the job description here…"
          rows="6"
        ></textarea>
        <div class="char-counter"><span id="jdCharCount">0</span> characters</div>
      </div>
    </div>

    <!-- Action buttons row -->
    <div class="btn-row">
      <button id="fillBtn" class="btn btn--primary" disabled>
        <span class="btn-icon">⚡</span>
        <span id="fillBtnText">Fill Fields</span>
      </button>
      <button id="answerBtn" class="btn btn--teal" disabled>
        <span class="btn-icon">✍️</span>
        <span id="answerBtnText">Answer Questions</span>
      </button>
    </div>

    <!-- Status / Result card -->
    <div id="resultCard" class="result-card result-card--hidden"></div>

  </main>

  <!-- ══ PROFILE TAB ═══════════════════════════════════════ -->
  <main id="viewProfile" class="main tab-content">
    
    <!-- Extract from Resume action -->
    <div class="field-group" style="margin-bottom: 12px;">
      <button id="extractResumeBtn" class="btn btn--secondary" style="width: 100%;">
        <span class="btn-icon">🪄</span> Auto-fill from Primary Resume
      </button>
      <div id="extractResultCard" class="result-card result-card--hidden" style="margin-top:8px;"></div>
    </div>

    <form id="profileForm" style="display:flex; flex-direction:column; gap:12px;">
      <!-- Personal Info -->
      <div class="profile-grid">
        <div class="field-group full-width">
          <label class="label">Full Name</label>
          <input type="text" id="prof_full_name" class="input" />
        </div>
        <div class="field-group">
          <label class="label">Email</label>
          <input type="email" id="prof_email" class="input" />
        </div>
        <div class="field-group">
          <label class="label">Phone</label>
          <input type="text" id="prof_phone" class="input" />
        </div>
        <div class="field-group">
          <label class="label">Gender</label>
          <select id="prof_gender" class="input">
            <option value="">Select...</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="non-binary">Non-binary</option>
            <option value="prefer_not_to_say">Prefer not to say</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field-group">
          <label class="label">Nationality</label>
          <input type="text" id="prof_nationality" class="input" />
        </div>
        <div class="field-group">
          <label class="label">DOB</label>
          <input type="date" id="prof_dob" class="input" />
        </div>
        <div class="field-group" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="prof_disability" />
          <label class="label" style="margin:0;">Disability</label>
        </div>
      </div>

      <!-- Address -->
      <div class="profile-grid">
        <div class="field-group full-width">
          <label class="label">Address Line</label>
          <input type="text" id="prof_address_line" class="input" />
        </div>
        <div class="field-group">
          <label class="label">City</label>
          <input type="text" id="prof_city" class="input" />
        </div>
        <div class="field-group">
          <label class="label">State</label>
          <input type="text" id="prof_state" class="input" />
        </div>
        <div class="field-group">
          <label class="label">Pincode</label>
          <input type="text" id="prof_pincode" class="input" />
        </div>
        <div class="field-group">
          <label class="label">Country</label>
          <input type="text" id="prof_country" class="input" />
        </div>
      </div>

      <!-- Professional / Availability -->
      <div class="profile-grid">
        <div class="field-group">
          <label class="label">Current Salary</label>
          <input type="number" id="prof_current_salary" class="input" />
        </div>
        <div class="field-group">
          <label class="label">Expected Salary</label>
          <input type="number" id="prof_expected_salary" class="input" />
        </div>
        <div class="field-group">
          <label class="label">Notice Period (Days)</label>
          <input type="number" id="prof_notice_period" class="input" />
        </div>
      </div>

      <!-- Job Preferences -->
      <div class="profile-grid">
        <div class="field-group full-width">
          <label class="label">Preferred Locations (comma separated)</label>
          <input type="text" id="prof_preferred_locations" class="input" placeholder="e.g. Bangalore, Remote, Mumbai" />
        </div>
      </div>

      <!-- Links -->
      <div class="field-group">
        <label class="label">LinkedIn URL</label>
        <input type="url" id="prof_linkedin_url" class="input" />
      </div>
      <div class="field-group">
        <label class="label">GitHub URL</label>
        <input type="url" id="prof_github_url" class="input" />
      </div>
      <div class="field-group">
        <label class="label">Portfolio URL</label>
        <input type="url" id="prof_portfolio_url" class="input" />
      </div>

      <button type="submit" id="saveProfileBtn" class="btn btn--primary" style="margin-top: 8px;">
        💾 Save Profile
      </button>
      <div id="profileResultCard" class="result-card result-card--hidden"></div>
    </form>
  </main>

  <!-- ══ SETTINGS PANEL ════════════════════════════════════ -->
  <section class="settings-panel">
    <button id="settingsToggle" class="settings-toggle" aria-expanded="false">
      <span class="settings-toggle-icon">⚙</span> Account Settings
      <span class="settings-toggle-arrow">▾</span>
    </button>

    <div id="settingsBody" class="settings-body settings-body--collapsed">
      <div class="settings-section">
        <!-- Auth form (shown when logged out) -->
        <div id="loginSection">
          <div style="display:flex; justify-content: space-between; margin-top: 10px; align-items: baseline;">
            <label class="label" id="authModeLabel" style="margin-top: 0;">Login</label>
            <button id="toggleAuthModeBtn" style="background: none; border: none; color: var(--accent); cursor: pointer; font-size: 11px; text-decoration: underline; font-family: inherit; transition: color var(--transition);">Create Account instead</button>
          </div>
          
          <div id="signupFields" style="display: none;">
            <label class="label" for="signupName" style="margin-top:8px;">Name</label>
            <input id="signupName" type="text" class="input" placeholder="Your Name" autocomplete="name" />
          </div>

          <label class="label" for="loginEmail" style="margin-top:8px;">Email</label>
          <input id="loginEmail" type="email" class="input" placeholder="you@example.com" autocomplete="email" />
          
          <label class="label" for="loginPassword" style="margin-top:8px;">Password</label>
          <div class="api-key-row">
            <input id="loginPassword" type="password" class="input" placeholder="••••••••" autocomplete="current-password" />
            <button id="toggleLoginPwVisibility" class="btn btn--icon" title="Show/Hide">👁</button>
          </div>
          <button id="loginBtn" class="btn btn--secondary" style="margin-top:8px;">Login</button>
        </div>

        <!-- Logged-in actions (shown when logged in) -->
        <div id="loggedInSection" style="display:none;">
          <div class="btn-row" style="margin-top:8px;">
            <button id="logoutBtn" class="btn btn--icon" title="Logout" style="color:#f87171; width:100%;">⬡ Logout</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ══ FOOTER ════════════════════════════════════════════ -->
  <footer class="footer">
    Powered by AI Form Filler · Manifest V3
  </footer>

  <script src="popup.js"></script>
</body>
</html>
